name: Release APK

# Tag a commit to publish:  git tag v9.4.1-mangaki.1 && git push --tags
# Or run it by hand from the Actions tab to get an APK without publishing.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      publish:
        description: 'Attach the APK to a GitHub release'
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      # Gradle 9 and AGP for compileSdk 36 both want a modern JDK; 17 is the
      # version Android tooling is actually tested against.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4

      # The keystore lives only in secrets. Written to a path outside the
      # workspace so no later step can sweep it into an artifact.
      - name: Restore keystore
        id: keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::KEYSTORE_BASE64 is not set. An unsigned APK cannot be installed, so this stops here rather than publishing one. See tools/README-release.md."
            exit 1
          fi
          mkdir -p "$RUNNER_TEMP/signing"
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/signing/keystore.jks"
          echo "path=$RUNNER_TEMP/signing/keystore.jks" >> "$GITHUB_OUTPUT"

      - name: Build release APK
        env:
          KEYSTORE_FILE: ${{ steps.keystore.outputs.path }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew --no-daemon assembleRelease

      # Gradle signs during assemble, but only if it found the keystore. A
      # silently unsigned APK looks identical until someone tries to install
      # it, so it is checked here instead of by the first person to download.
      - name: Verify the APK is signed
        run: |
          APK=$(find app/build/outputs/apk/release -name '*.apk' | head -1)
          if [ -z "$APK" ]; then
            echo "::error::No APK was produced."
            exit 1
          fi
          echo "APK=$APK" >> "$GITHUB_ENV"

          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner | sort -V | tail -1)
          "$APKSIGNER" verify --print-certs "$APK"

      - name: Rename for humans
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          [ "$VERSION" = "$GITHUB_REF_NAME" ] && VERSION="$(git rev-parse --short HEAD)"
          cp "$APK" "mangaki-${VERSION}.apk"
          echo "ARTIFACT=mangaki-${VERSION}.apk" >> "$GITHUB_ENV"
          sha256sum "mangaki-${VERSION}.apk" | tee "mangaki-${VERSION}.apk.sha256"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ARTIFACT }}
          path: |
            ${{ env.ARTIFACT }}
            ${{ env.ARTIFACT }}.sha256
          retention-days: 30

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v') || inputs.publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --title "$GITHUB_REF_NAME" \
            --generate-notes \
            "$ARTIFACT" "$ARTIFACT.sha256" \
            || gh release upload "$GITHUB_REF_NAME" "$ARTIFACT" "$ARTIFACT.sha256" --clobber
